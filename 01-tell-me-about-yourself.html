 box(58,537,1164,119,'#091c29',12);let matches=[...s.text.matchAll(/\S+/g)];let active=-1;for(let j=0;j<s.words.length;j++)if(local>=s.words[j].at)active=j;

let lastIndex=-1;
function findScene(t){let i=SCENES.findIndex(s=>t>=s.start&&t<s.end);return i<0?(t>=SCENES.at(-1).end?SCENES.length-1:0):i}
function draw(t,dom=true){const i=findScene(t),s=SCENES[i],local=Math.max(0,t-s.start);backdrop();text('THE TRUST ACCOUNTANT',64,49,16,C.teal,'left',600);text(`SCENE ${String(i+1).padStart(2,'0')} / ${SCENES.length}`,1215,49,16,C.muted,'right');fit(s.title,640,104,1130,38,C.ink);film(s,local);captions(s,local);box(64,686,1152,4,C.line,2);box(64,686,1152*clamp(t/SCENES.at(-1).end),4,C.gold,2);if(dom){document.getElementById('seek').value=t;document.getElementById('current').textContent=clock(t);if(lastIndex!==i){document.getElementById('scene').value=i;document.getElementById('accessible').textContent=s.text;document.querySelectorAll('.transcript p').forEach((p,j)=>p.classList.toggle('active',i===j));lastIndex=i;document.getElementById('status').textContent=`Scene ${i+1} of ${SCENES.length} · ${s.title}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===SCENES.length-1;}}return i}
function clock(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
const total=SCENES.at(-1).end;document.getElementById('duration').textContent=clock(total);document.getElementById('seek').max=total;
SCENES.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' · '+s.title;document.getElementById('scene').append(o);let p=document.createElement('p');p.textContent=s.text;p.tabIndex=0;p.onclick=()=>jump(i);p.onkeydown=e=>{if(e.key==='Enter')jump(i)};document.getElementById('transcript').append(p)});
function jump(i){i=Math.max(0,Math.min(SCENES.length-1,i));audio.currentTime=Math.min(SCENES[i].start+.001,SCENES[i].end-.001);draw(audio.currentTime)}
async function play(){if(audio.paused){if(audio.currentTime>=total-.15)jump(0);try{await audio.play()}catch(e){document.getElementById('status').textContent='Audio could not start. Press Play again.'}}else audio.pause()}
document.getElementById('play').onclick=play;audio.onplay=()=>document.getElementById('play').textContent='Pause';audio.onpause=()=>document.getElementById('play').textContent='Play story';audio.onended=()=>{document.getElementById('play').textContent='Replay story';draw(total-.01);document.getElementById('status').textContent='Story complete. Replay it or step through any scene.'};document.getElementById('seek').oninput=e=>{audio.currentTime=+e.target.value;draw(audio.currentTime)};document.getElementById('prev').onclick=()=>jump(findScene(audio.currentTime)-1);document.getElementById('next').onclick=()=>jump(findScene(audio.currentTime)+1);document.getElementById('replay').onclick=()=>jump(findScene(audio.currentTime));document.getElementById('scene').onchange=e=>jump(+e.target.value);document.getElementById('speed').onchange=e=>audio.playbackRate=+e.target.value;document.getElementById('sound').onclick=e=>{audio.muted=!audio.muted;e.target.textContent=audio.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',String(audio.muted))};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key==='ArrowRight'){e.preventDefault();jump(findScene(audio.currentTime)+1)}else if(e.key==='ArrowLeft'){e.preventDefault();jump(findScene(audio.currentTime)-1)}});
function tick(){if(!audio.paused)draw(audio.currentTime);requestAnimationFrame(tick)}draw(0);tick();
window.bpa={scenes:SCENES,renderAt:t=>draw(t,false),duration:total};
