async function play(){if(audio.paused){if(audio.currentTime>=total-.15)jump(0);try{await audio.play()}catch(e){document.getElementById('status').textContent='Audio could not start. Press Play again.'}}else audio.pause()}
document.getElementById('play').onclick=play;audio.onplay=()=>document.getElementById('play').textContent='Pause';audio.onpause=()=>document.getElementById('play').textContent='Play story';audio.onended=()=>{document.getElementById('play').textContent='Replay story';draw(total-.01);document.getElementById('status').textContent='Story complete. Replay it or step through any scene.'};document.getElementById('seek').oninput=e=>{audio.currentTime=+e.target.value;draw(audio.currentTime)};document.getElementById('prev').onclick=()=>jump(findScene(audio.currentTime)-1);document.getElementById('next').onclick=()=>jump(findScene(audio.currentTime)+1);document.getElementById('replay').onclick=()=>jump(findScene(audio.currentTime));document.getElementById('scene').onchange=e=>jump(+e.target.value);document.getElementById('speed').onchange=e=>audio.playbackRate=+e.target.value;document.getElementById('sound').onclick=e=>{audio.muted=!audio.muted;e.target.textContent=audio.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',String(audio.muted))};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key==='ArrowRight'){e.preventDefault();jump(findScene(audio.currentTime)+1)}else if(e.key==='ArrowLeft'){e.preventDefault();jump(findScene(audio.currentTime)-1)}});
function tick(){if(!audio.paused)draw(audio.currentTime);requestAnimationFrame(tick)}draw(0);tick();
window.bpa={scenes:SCENES,renderAt:t=>draw(t,false),duration:total};
</script></body></html>
